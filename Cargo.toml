[workspace]
resolver = "3"
members = ["corral", "corral-dsp", "analyse", "xtask"]

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Recommended by nice-plug's GETTING_STARTED.md.
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"

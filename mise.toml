min_version = "2026.3.12"

[tools]
# mise 2026.3.x only parses comma-separated strings (no spaces) for these options.
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "aarch64-apple-darwin,x86_64-apple-darwin" }

[tasks.build]
description = "Bundle corral as VST3 and CLAP for the host architecture (release)"
run = "cargo xtask bundle corral --release"

[tasks.build-universal]
description = "Bundle corral as universal (arm64 + x86_64) macOS VST3 and CLAP (release)"
run = "cargo xtask bundle-universal corral --release"

[tasks.require-live-closed]
hide = true
# Exact process-name match. `pgrep -f` would match this script's own `sh -c`.
run = '''
if pgrep -xq Live; then
  echo "Ableton Live is running. Quit Ableton Live first, then run 'mise run install' (or 'install-debug') again." >&2
  exit 1
fi
'''

[tasks.copy-bundle]
hide = true
run = '''
set -eu
bundle=target/bundled/Corral.vst3
dest="$HOME/Library/Audio/Plug-Ins/VST3"

# The xtask signs too, but ignores codesign's exit code.
codesign --force --deep -s - "$bundle"
codesign --verify --verbose "$bundle"

mkdir -p "$dest"
# Remove, then copy: overwriting a signed binary in place can get the host
# killed with "Code Signature Invalid".
rm -rf "$dest/Corral.vst3"
cp -R "$bundle" "$dest/"
echo "Installed $dest/Corral.vst3"
'''

[tasks.install]
description = "Build the universal VST3, ad-hoc sign it, and install it to ~/Library/Audio/Plug-Ins/VST3 (quit Ableton Live first)"
run = [{ task = "require-live-closed" }, { task = "build-universal" }, { task = "copy-bundle" }]

# Doesn't work in Ableton Live 10 yet: nice-plug's debug-only alignment check
# fails on Live's channel pointers and aborts before process() runs (see the
# ROADMAP icebox).
[tasks.install-debug]
description = "Build a debug universal VST3 with nice-plug's allocation assertions (aborts Live if process() allocates), sign it and install it (quit Ableton Live first)"
run = [
  { task = "require-live-closed" },
  "cargo xtask bundle-universal corral --features assert_process_allocs",
  { task = "copy-bundle" },
]

[tasks.fmt]
description = "Format all workspace code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without changing files"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy on all targets, treating warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the workspace unit tests"
run = "cargo test --workspace"

[tasks.analyse]
description = "Run the plugin's DSP chain on a WAV: analyse <in.wav> [out.wav] [--voices <row>…] [--glide <ms>] [--mix <percent>] (writes out.wav and out.csv; paths are relative to the project root)"
run = "cargo run --release --quiet -p analyse --"

[tasks.fixtures]
description = "Download the pitch datasets into .datasets/ (~2.2 GB, once) and regenerate the committed test fixtures"
run = '''
set -eu
mkdir -p .datasets
cd .datasets
fetch() { [ -f "$1" ] || { curl --fail --location --output "$1.part" "$2" && mv "$1.part" "$1"; }; }
fetch vocadito.zip 'https://zenodo.org/records/5578807/files/vocadito.zip?download=1'
fetch MDB-stem-synth.tar.gz 'https://zenodo.org/records/1481172/files/MDB-stem-synth.tar.gz?download=1'
fetch nsynth-test.jsonwav.tar.gz 'http://download.magenta.tensorflow.org/datasets/nsynth/nsynth-test.jsonwav.tar.gz'
# Vocadito's md5 is published; the other two were recorded on first download (2026-09-27).
[ "$(md5 -q vocadito.zip)" = dea40fd18f14d899643c4ba221b33a46 ] || { echo "vocadito.zip checksum mismatch" >&2; exit 1; }
shasum -a 256 --check --quiet <<'SUMS'
92c3349e62b1e0cfca07a286d47fe3b19c4e46da71ccd19554b6e2aab172aa1a  MDB-stem-synth.tar.gz
0f9ba5d62beba9ec4612f918d19f5e87a681822f1c566124f05fe8b27a51934c  nsynth-test.jsonwav.tar.gz
SUMS
[ -d vocadito ] || unzip -q vocadito.zip -x '__MACOSX/*' -d vocadito
[ -d mdb ] || { mkdir mdb && tar -xzf MDB-stem-synth.tar.gz -C mdb; }
[ -d nsynth ] || { mkdir nsynth && tar -xzf nsynth-test.jsonwav.tar.gz -C nsynth; }
cd ..
cargo run --release --quiet -p fixtures -- build
'''

[tasks.check]
description = "Run fmt-check, lint, then test (the CI entry point)"
run = [{ task = "fmt-check" }, { task = "lint" }, { task = "test" }]
